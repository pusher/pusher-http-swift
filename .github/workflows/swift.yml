name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Linting
      run: swift run swiftlint
    - name: Build
      run: swift build -v
    - name: Disable IPv6 (works around macOS runner Happy Eyeballs flakiness)
      run: |
        networksetup -listallnetworkservices
        networksetup -listallnetworkservices | tail -n +2 | while IFS= read -r service; do
          sudo networksetup -setv6off "$service" || true
        done
    - name: Run tests
      env:
          TEST_APP_ID: ${{ secrets.CI_APP_ID }}
          TEST_APP_KEY: ${{ secrets.CI_APP_KEY }}
          TEST_APP_SECRET: ${{ secrets.CI_APP_SECRET }}
          TEST_APP_CLUSTER: ${{ secrets.CI_APP_CLUSTER }}
          TEST_ENCRYPTION_MASTER_KEY: ${{ secrets.CI_ENCRYPTION_MASTER_KEY }}
      run: swift test -v
